# Render blueprint for the Zenex API.
# Create the service from this file, then fill in the secret env vars in the
# Render dashboard (they're marked sync:false so they're never committed).
services:
  - type: web
    name: zenex-api
    runtime: node
    plan: starter
    # Render has no Canadian region. Ohio is the closest to the Supabase
    # database in ca-central-1 (Montreal) — roughly 20ms vs ~75ms from Oregon.
    # Every API request makes several DB round-trips, so this hop dominates
    # perceived speed far more than the browser-to-API distance.
    region: ohio
    rootDir: zenex-api
    # `npm ci --include=dev` is required: Render sets NODE_ENV=production, which
    # would otherwise skip devDependencies — and @nestjs/cli lives there, so
    # `nest build` would emit nothing and the deploy would fail at startup.
    buildCommand: npm ci --include=dev && npm run build
    # Runs pending migrations before booting, so deploys stay in sync with the DB.
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      # ── Set these in the Render dashboard ──
      - key: DATABASE_URL # Supabase pooled connection (port 6543)
        sync: false
      - key: DIRECT_URL # Supabase direct connection (port 5432)
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS # e.g. https://zenex.vercel.app
        sync: false
      - key: APP_URL # public frontend URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: zenex-uploads
      # ── Email: ZeptoMail (Zoho) ──
      # Send Mail Token from Agents > SMTP/API. Leave unset and email drops to
      # log mode rather than failing.
      - key: ZEPTOMAIL_TOKEN
        sync: false
      # Change to api.zeptomail.eu / .in if the Zoho account is in that region.
      - key: ZEPTOMAIL_API_URL
        value: https://api.zeptomail.com/v1.1/email
      # Domain must be verified in the ZeptoMail agent or every send is rejected.
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Zenex
      - key: MAIL_REPLY_TO
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PLATFORM_FEE_PERCENT
        value: "15"
      - key: FREE_CANCEL_HOURS
        value: "24"
      - key: LATE_CANCEL_REFUND_PERCENT
        value: "50"
